[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "icloud-agent"
version = "0.2.0"
description = "Local iCloud Mail and Calendar CLI, skill, and stdio MCP tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Mark Unthank"}]
keywords = ["icloud", "mcp", "codex", "caldav", "imap", "cli", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Email",
]
dependencies = [
  "caldav>=3.3.1,<4", "icalendar>=7.3,<8", "imapclient>=3.1,<4",
  "keyring>=25.7,<26", "mcp>=1.30,<2",
  "platformdirs>=4,<5", "filelock>=3.20,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.16,<1", "build>=1.4,<2", "markdown-it-py>=3,<5"]

[project.urls]
Homepage = "https://github.com/MarkUnthank/icloud-agent"
Documentation = "https://github.com/MarkUnthank/icloud-agent#documentation"
Issues = "https://github.com/MarkUnthank/icloud-agent/issues"
Changelog = "https://github.com/MarkUnthank/icloud-agent/blob/main/CHANGELOG.md"

[project.scripts]
icloud-agent = "icloud_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/icloud_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.hatch.build]
artifacts = ["src/icloud_agent/resources/plugin/.mcp.json", "src/icloud_agent/resources/plugin/.codex-plugin/plugin.json"]
