name: Bug report
description: Report a reproducible problem using redacted or synthetic data.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, use private reporting in SECURITY.md. Never include passwords, account config, private emails, calendar details, or real resource IDs."
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of icloud-agent --version, or a commit SHA.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, installation method, and agent/client version if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands and synthetic inputs; redact account data and resource IDs.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include only safe error codes/types. For a write, state whether the result is confirmed or uncertain.
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: Evidence source
      options:
        - Local test with synthetic data
        - Live iCloud read
        - Explicitly authorized live iCloud write
        - Agent/client integration
    validations:
      required: true
